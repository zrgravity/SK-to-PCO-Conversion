name = "sk-to-pco"
main = "src/index.ts"
compatibility_date = "2025-11-10"
compatibility_flags = ["nodejs_compat"]

# Static assets (UI)
assets = { directory = "public" }

[[d1_databases]]
binding = "DB"
database_name = "sk-pco-db"
database_id = "c6860a34-f3cd-4bcf-8076-1373b723b1b2"

[vars]
# PCO_APP_ID and PCO_APP_SECRET are set as secrets via:
#   wrangler secret put PCO_APP_ID
#   wrangler secret put PCO_APP_SECRET
# PCO Personal Access Token application ID and secret.

# Cloudflare Access audience tag for verifying CF-Access-Jwt-Assertion
# Set via: wrangler secret put CF_ACCESS_AUD
# Leave empty to skip JWT verification in local dev.

[[routes]]
pattern = "sk-pco.giedesignweb.com"
custom_domain = true

[limits]
# Allow up to 30 s of CPU time so diff over ~2000 people doesn't hit the
# default 50 ms CPU limit on the Workers paid plan.
cpu_ms = 30000

[dev]
port = 8787
local_protocol = "http"

# ── Environments ──────────────────────────────────────────────────────────────

# Local testing uses a local D1 replica; no extra config needed.
# For preview deployments, add a [env.preview] block with its own D1 id.
